# Base commune — toujours utiliser avec -f docker-compose.dev.yml OU -f docker-compose.prod.yml
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - '4000'
    environment:
      PORT: '4000'
      HOST: '0.0.0.0'
      SEARCH_MAX_RESULTS: '10'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_STATS_SECRET: ${ADMIN_STATS_SECRET:-}
      DOWNLOAD_STATS_PATH: ${DOWNLOAD_STATS_PATH:-}
      LOG_FILTER_DELEGATIONS_POLL: ${LOG_FILTER_DELEGATIONS_POLL:-}
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_FB_APP_ID: ${VITE_FB_APP_ID:-}
    depends_on:
      - api
    restart: unless-stopped
