name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.YTKEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync to VPS
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env*' \
            --exclude '*.md' \
            --exclude 'test-*.sh' \
            --exclude '.gitignore' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/html/ytWeb/

      # Recrée tout le .env à chaque déploiement — tout ce qui n’est pas listé ici est perdu.
      # Secrets GitHub recommandés : WEBSHARE_API_KEY, WORKER_INGEST_SECRET, ADMIN_STATS_SECRET,
      # WORKER_LOCAL_URL (optionnel ; défaut runner ci‑dessous si vide).
      - name: Create .env file with secrets
        run: |
          WLU="${{ secrets.WORKER_LOCAL_URL }}"
          if [ -z "$WLU" ]; then WLU="http://host.docker.internal:7410"; fi
          {
            printf '%s\n' "WEBSHARE_API_KEY=${{ secrets.WEBSHARE_API_KEY }}"
            printf '%s\n' "WORKER_INGEST_SECRET=${{ secrets.WORKER_INGEST_SECRET }}"
            printf '%s\n' "ADMIN_STATS_SECRET=${{ secrets.ADMIN_STATS_SECRET }}"
            printf '%s\n' "WORKER_LOCAL_URL=${WLU}"
          } | ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "umask 077; cat > /var/www/html/ytWeb/.env && chmod 600 /var/www/html/ytWeb/.env"

      - name: Docker Compose (prod)
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /var/www/html/ytWeb && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build"
