# Production (VPS) : web sur localhost uniquement — Apache reverse proxy vers 127.0.0.1:7000
#
# Variables utilisées depuis /var/www/html/ytWeb/.env (voir deploy.yml) ou l’host :
# WEBSHARE_API_KEY, WORKER_INGEST_SECRET (secrets GitHub recommandés)
# Worker via tunnel SSH (-R) : le port est sur l’hôte Linux, pas dans le conteneur api.
# Utiliser host.docker.internal (extra_hosts) plutôt que 127.0.0.1 depuis le conteneur.
# WORKER_LOCAL_URL par défaut dans deploy : http://host.docker.internal:7410
services:
  api:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-https://yt.codeurbase.fr}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-10}
      PROXY_URL: ${PROXY_URL:-}
      WEBSHARE_API_KEY: ${WEBSHARE_API_KEY:-}
      WORKER_LOCAL_URL: ${WORKER_LOCAL_URL:-}
      WORKER_CONNECTIVITY_LOG_MS: ${WORKER_CONNECTIVITY_LOG_MS:-}
      WORKER_INGEST_SECRET: ${WORKER_INGEST_SECRET:-}

  web:
    ports:
      - '127.0.0.1:7000:80'
