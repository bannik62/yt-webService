# Production (VPS) : web sur localhost uniquement — Apache reverse proxy vers 127.0.0.1:7000
#
# Variables utilisées depuis /var/www/html/ytWeb/.env (voir deploy.yml) ou l’host :
# WEBSHARE_API_KEY, WORKER_INGEST_SECRET (secrets GitHub recommandés)
# ADMIN_STATS_SECRET : Bearer pour GET /api/admin/download-stats (compteur téléchargements).
# DOWNLOAD_STATS_PATH : optionnel, chemin absolu du JSON de stats dans le conteneur api.
# LOG_LEVEL : pino (ex. info, warn) — warn réduit le bruit des logs HTTP.
# LOG_FILTER_DELEGATIONS_POLL : vide ou 1 = masquer les logs du poll GET /api/worker/delegations/next ; 0 = tout afficher.
# Build image web : VITE_FB_APP_ID (chiffres uniquement, app Meta) pour index.html.
# API : SITE_URL (og:url https), FB_APP_ID (meta fb:app_id sur GET /v/:id) — optionnel mais recommandé pour Meta.
# Worker via tunnel SSH (-R) : le port est sur l’hôte Linux, pas dans le conteneur api.
# Utiliser host.docker.internal (extra_hosts) plutôt que 127.0.0.1 depuis le conteneur.
# WORKER_LOCAL_URL par défaut dans deploy : http://host.docker.internal:7410
# Le tunnel worker doit écouter « au-delà » de 127.0.0.1 sur le VPS (SSH_REMOTE_BIND + GatewayPorts sshd)
# ou api en Host network avec 127.0.0.1:SSH_RPORT.
# WORKER_INGEST_MAX_IDLE_MS (défaut 900000 dans le code si absent) désactive POST /api/worker/* après X ms sans succès GET {WORKER_LOCAL_URL}/health ; 0 = désactive cette garde.
# WORKER_INGEST_PING_INTERVAL_MS défaut 30000 : fréquence des pings santé GET {WORKER_LOCAL_URL}/health lorsque la garde ingest est active (sans ligne de log répétitive).
# WORKER_LOCAL_DELEGATION_WAIT_MS (défaut 90000 ms) : après erreur quota proxy avec en-tête de session navigateur, délai avant échec « délégation » sans ingest worker.
services:
  api:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:-https://yt.codeurbase.fr}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://yt.codeurbase.fr}
      # Liens OG en https même si la liaison jusqu’à ce conteneur est en clair (hors localhost). Désactiver : FORCE_HTTPS_PUBLIC_ORIGIN=0
      FORCE_HTTPS_PUBLIC_ORIGIN: ${FORCE_HTTPS_PUBLIC_ORIGIN:-1}
      FB_APP_ID: ${FB_APP_ID:-}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-30}
      PROXY_URL: ${PROXY_URL:-}
      WEBSHARE_API_KEY: ${WEBSHARE_API_KEY:-}
      WORKER_LOCAL_URL: ${WORKER_LOCAL_URL:-}
      WORKER_INGEST_SECRET: ${WORKER_INGEST_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_STATS_SECRET: ${ADMIN_STATS_SECRET:-}
      DOWNLOAD_STATS_PATH: ${DOWNLOAD_STATS_PATH:-}
      LOG_FILTER_DELEGATIONS_POLL: ${LOG_FILTER_DELEGATIONS_POLL:-}

  web:
    ports:
      - '127.0.0.1:7000:80'
