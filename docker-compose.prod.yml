# Production (VPS) : web sur localhost uniquement — Apache reverse proxy vers 127.0.0.1:7000
#
# Aucun fichier obligatoire : CORS par défaut ci-dessous. Pour surcharger, crée /var/www/html/ytWeb/.env
# (Compose charge automatiquement .env pour ${...}) ou exporte les variables avant `docker compose`.
services:
  api:
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-https://yt.codeurbase.fr}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-10}

  web:
    ports:
      - '127.0.0.1:7000:80'
