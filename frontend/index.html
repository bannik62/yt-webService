<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT Ripper Web</title>
    <meta
      name="description"
      content="Recherche YouTube et téléchargement MP3 : morceaux, playlists et tendances. Interface web simple."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YT Ripper Web" />
    %FB_APP_ID_META%
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="YT Ripper Web" />
    <meta
      property="og:description"
      content="Recherche YouTube et téléchargement MP3 : morceaux, playlists et tendances."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/ogImage.png" />
    <meta property="og:image:secure_url" content="%SITE_URL%/ogImage.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1774" />
    <meta property="og:image:height" content="887" />
    <meta
      property="og:image:alt"
      content="YT Ripper Web — recherche YouTube et téléchargement MP3"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YT Ripper Web" />
    <meta
      name="twitter:description"
      content="Recherche YouTube et téléchargement MP3 : morceaux, playlists et tendances."
    />
    <meta name="twitter:image" content="%SITE_URL%/ogImage.png" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar + bouton repli (desktop, mode Recherche uniquement) -->
      <div class="playlist-rail">
      <aside class="sidebar" id="download-list">
        <div class="sidebar-header">
          <div class="sidebar-header-top">
            <h2 class="sidebar-title">
              Ma liste
              <span class="badge" id="download-list-count" hidden>0</span>
            </h2>
          </div>
        </div>
        
        <div class="sidebar-body">
          <p class="queue-wait-hint" id="download-list-queue-hint" hidden></p>
          <ul class="download-list" id="download-list-items"></ul>
        </div>
        
        <div class="sidebar-footer">
          <button type="button" id="download-list-clear" class="btn playlist-footer-btn playlist-footer-btn--clear" hidden>
            Vider
          </button>
          <button type="button" id="download-list-play" class="btn playlist-footer-btn playlist-footer-btn--play" disabled>
            ▶ Lire
          </button>
        </div>
      </aside>
      <button
        type="button"
        id="playlist-rail-toggle"
        class="playlist-rail-toggle"
        hidden
        aria-expanded="true"
        aria-controls="download-list"
        aria-label="Masquer ma liste"
      >
        <span class="playlist-rail-toggle__chev" aria-hidden="true"></span>
      </button>
      </div>

      <!-- Contenu principal -->
      <main class="main-content">
        <!-- Mobile : header défile. Desktop : .search-page-top entier sticky. -->
        <div class="search-page-top">
          <header class="header">
            <div class="brand">
              <span class="pill yt">YT</span>
              <span class="pill rest">ripper</span>
            </div>

            <div class="mode-selector">
              <label class="mode-option mode-option--with-mode-icon mode-option--search" title="Recherche">
                <input type="radio" name="mode" value="search" checked />
                <span class="mode-option__icon" aria-hidden="true">🔍</span>
                <span class="mode-option__text">Recherche</span>
              </label>
              <label class="mode-option mode-option--with-mode-icon mode-option--ripper" title="Ripper">
                <input type="radio" name="mode" value="ripper" />
                <span class="mode-option__icon mode-option__icon--ripper" aria-hidden="true">
                  <span class="ripper-mp3-badge">MP3</span>
                </span>
                <span class="mode-option__text">Ripper</span>
              </label>
            </div>

            <button
              type="button"
              id="refresh-proxy-btn"
              class="btn btn-ghost btn-icon"
              title="Sélectionner un proxy"
              aria-label="Sélectionner un proxy"
            >
              Proxy
            </button>
          </header>

          <div class="search-top-sticky-zone">
          <!-- Mobile : bandeau sticky (tendances + formulaire). Desktop : display: contents. -->
          <div class="search-mobile-sticky-band">
          <div class="search-chrome">
            <div class="search-header">
              <div class="search-header-trending">
                <label class="trending-inline-label" for="trending-music-only">
                  <input type="checkbox" id="trending-music-only" />
                  <span>🎵 Musique uniquement</span>
                </label>
                <button
                  type="button"
                  id="trending-btn"
                  class="btn btn-secondary"
                  title="Découverte aléatoire — get lucky"
                >
                  Get lucky
                </button>
              </div>
            </div>
          </div>

          <!-- Phrase contexte + formulaire (mobile : sticky seul ce bloc ; desktop : zone parente) -->
          <div class="search-sticky-stack">
            <p class="hint hint--search-context" id="search-hint" hidden></p>
            <div class="search-form-sticky">
              <form class="search-form" id="search-form" action="#" method="get">
                <input
                  id="search-input"
                  name="q"
                  type="search"
                  autocomplete="off"
                  placeholder="Rechercher une musique…"
                  maxlength="500"
                  required
                  aria-label="Rechercher une musique sur YouTube"
                />
                <div class="search-form-actions" id="search-form-actions">
                  <button
                    type="submit"
                    class="search-btn search-btn--submit"
                    id="search-submit-btn"
                    aria-label="Rechercher"
                  >
                    <span class="search-btn-label">Rechercher</span>
                    <svg
                      class="search-btn-icon search-btn-icon--search"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      aria-hidden="true"
                    >
                      <circle cx="11" cy="11" r="7" />
                      <path d="M20 20l-3.5-3.5" />
                    </svg>
                  </button>
                  <button
                    type="button"
                    class="search-btn search-btn--clear"
                    id="search-clear-btn"
                    hidden
                    aria-label="Vider les résultats"
                  >
                    <svg
                      class="search-btn-icon"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <path d="M4 7h16" />
                      <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                      <path d="M10 11v6M14 11v6" />
                      <path d="M6 7l1 12a1 1 0 0 0 1 .9h8a1 1 0 0 0 1-.9l1-12" />
                    </svg>
                  </button>
                </div>
              </form>
            </div>
          </div>
          </div>
          </div>
        </div>

        <div class="view-container view-mode-animate" id="search-container">
          <section
            class="media-strip-section channel-favorites-section"
            id="channel-favorites-strip-section"
            hidden
          >
            <div class="media-strip-header">
              <h3 class="media-strip-title">Chaînes</h3>
              <button
                type="button"
                class="media-strip-clear"
                id="channel-favorites-clear"
                hidden
              >
                Tout effacer
              </button>
            </div>
            <div class="media-strip-carousel">
              <button
                type="button"
                class="media-strip-nav media-strip-nav--prev"
                id="channel-favorites-strip-prev"
                hidden
                aria-label="Défiler vers la gauche"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                  <path d="M14 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <div class="media-strip-viewport channel-favorites-viewport" id="channel-favorites-strip-viewport">
                <div class="media-strip-track channel-favorites-track" id="channel-favorites-strip"></div>
              </div>
              <button
                type="button"
                class="media-strip-nav media-strip-nav--next"
                id="channel-favorites-strip-next"
                hidden
                aria-label="Défiler vers la droite"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                  <path d="M10 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </section>
          <section class="media-strip-section" id="favorites-strip-section" hidden>
            <div class="media-strip-header">
              <h3 class="media-strip-title">Favoris</h3>
              <button type="button" class="media-strip-clear" id="favorites-clear" hidden>
                Tout effacer
              </button>
            </div>
            <div class="media-strip-carousel">
              <button
                type="button"
                class="media-strip-nav media-strip-nav--prev"
                id="favorites-strip-prev"
                hidden
                aria-label="Défiler vers la gauche"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                  <path d="M14 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <div class="media-strip-viewport" id="favorites-strip-viewport">
                <div class="media-strip-track" id="favorites-strip"></div>
              </div>
              <button
                type="button"
                class="media-strip-nav media-strip-nav--next"
                id="favorites-strip-next"
                hidden
                aria-label="Défiler vers la droite"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                  <path d="M10 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
            <p class="media-strip-empty" id="favorites-strip-empty" hidden>
              Ajoutez des vidéos avec l’étoile sur les miniatures.
            </p>
          </section>
          <section class="media-strip-section" id="history-strip-section" hidden>
            <div class="media-strip-header">
              <h3 class="media-strip-title">Historique</h3>
              <button type="button" class="media-strip-clear" id="history-strip-clear" hidden>
                Tout effacer
              </button>
            </div>
            <div class="media-strip-carousel">
              <button
                type="button"
                class="media-strip-nav media-strip-nav--prev"
                id="history-strip-prev"
                hidden
                aria-label="Défiler vers la gauche"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                  <path d="M14 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <div class="media-strip-viewport" id="history-strip-viewport">
                <div class="media-strip-track" id="history-strip"></div>
              </div>
              <button
                type="button"
                class="media-strip-nav media-strip-nav--next"
                id="history-strip-next"
                hidden
                aria-label="Défiler vers la droite"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                  <path d="M10 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </section>
          <div class="channel-context-bar" id="channel-context-bar" hidden>
            <button
              type="button"
              id="channel-favorite-btn"
              class="channel-favorite-btn"
              aria-pressed="false"
              title="Ajouter cette chaîne aux favoris"
            >
              <span class="channel-favorite-btn-star" aria-hidden="true">★</span>
              <span id="channel-favorite-btn-label">Chaîne en favoris</span>
            </button>
          </div>
          <ul class="results" id="search-results" aria-live="polite"></ul>
        </div>

        <!-- Vue Ripper -->
        <div class="view-container view-mode-animate" id="ripper-container" hidden>
          <form class="ripper-form" id="ripper-form" action="#" method="post">
            <div class="form-group">
              <label for="ripper-url">URL YouTube ou Playlist</label>
              <input
                id="ripper-url"
                type="url"
                placeholder="https://www.youtube.com/watch?v=..."
                required
              />
            </div>

            <fieldset class="mode-fieldset">
              <legend>Mode</legend>
              <label class="radio-label">
                <input type="radio" name="ripper-mode" value="single" checked />
                <span>Une seule musique</span>
                <span class="muted">(--no-playlist)</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="ripper-mode" value="playlist" />
                <span>Playlist</span>
                <span class="muted">(max 10 morceaux)</span>
              </label>
              
              <div id="ripper-max-container" class="max-container" hidden>
                <label for="ripper-max" class="muted">Max morceaux (vide = 10)</label>
                <input
                  id="ripper-max"
                  type="number"
                  min="1"
                  max="10"
                  placeholder="10"
                  class="input-sm"
                />
              </div>
            </fieldset>

            <div class="actions">
              <button type="button" id="ripper-download" class="btn btn-primary">Télécharger MP3</button>
            </div>
          </form>

          <p class="hint" id="ripper-hint" hidden></p>
          <div id="ripper-progress" class="progress-container"></div>
          <div id="ripper-logs" class="logs-container"></div>
        </div>
      </main>
    </div>

    <div
      id="playlist-sheet-backdrop"
      class="playlist-sheet-backdrop"
      hidden
      aria-hidden="true"
    ></div>
    <button
      type="button"
      id="playlist-fab"
      class="playlist-fab"
      aria-controls="download-list"
      aria-expanded="false"
      aria-label="Ouvrir ma liste de téléchargement"
    >
      <span class="playlist-fab__icon" aria-hidden="true">📋</span>
      <span class="playlist-fab__label">Liste</span>
      <span class="playlist-fab__badge" id="playlist-fab-count" hidden>0</span>
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
