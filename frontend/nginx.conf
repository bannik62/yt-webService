server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Aligné avec @fastify/multipart limits.fileSize (backend) pour POST /api/worker/ingest
    client_max_body_size 800m;

    # Poll worker — très fréquent ; évite de spammer les access logs Docker / VPS
    location = /api/worker/delegations/next {
        access_log off;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    location /api {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
        # Grosses pièces jointes ingest : envoyer sans buffer disque nginx entier si possible
        proxy_request_buffering off;

        # SSE support (pour /api/jobs/:id/stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Vignettes OG (même domaine que le site) — avant le fallback SPA
    location /share-thumb/ {
        max_ranges 0;
        proxy_set_header Range "";
        proxy_set_header If-Range "";
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    }

    # Pages partage Open Graph (/v/:videoId) — avant le fallback SPA
    location /v/ {
        # Crawlers (Meta/LinkedIn) envoient souvent Range: → 206 ; forcer 200 + corps complet
        max_ranges 0;
        proxy_set_header Range "";
        proxy_set_header If-Range "";
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    }

    # Page d’accueil (HTML) : crawlers Meta envoient souvent Range: → 206 sans cette règle
    location = / {
        max_ranges 0;
        try_files /index.html =404;
    }

    location = /index.html {
        max_ranges 0;
    }

    # OG / favicon : pas de plages HTTP → 200
    location ~* ^/(ogImage|favicon)\.png$ {
        max_ranges 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
